[project]
name = "traffic-incident-live-data"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    "apscheduler>=3.10",
    "geopandas>=0.14",
    "python-dotenv>=1.0",
    "boto3>=1.34",
    "pyarrow>=15.0",
    "pyproj>=3.6",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
