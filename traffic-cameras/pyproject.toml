[project]
name = "traffic-cameras"
version = "0.1.0"
description = "Rainfall-triggered UK traffic-camera flood image downloader + camera discovery toolchain"
requires-python = ">=3.12"
dependencies = [
  # pins mirror the original rainfall-cron pyproject on Paris
  "requests>=2.28.0,<3.0",
  "urllib3>=1.26.0,<3.0",
  "fake-useragent>=1.2.0,<3.0",
  "numpy>=1.24.0,<3.0",
  "pyproj>=3.5.0,<4.0",
  "boto3>=1.26.0,<2.0",
  "pillow>=9.0.0,<12.0",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "rainfall_trigger",
  "find_rainy_asc",
  "Scan_cameras",
  "Download_images",
  "camera_metadata",
  "xml_to_geojson",
  "match_cameras",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
